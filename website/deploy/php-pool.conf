[scroll-studio]
user = scrollstudio
group = scrollstudio
listen = /run/php/scroll-studio.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 200
request_terminate_timeout = 150s
clear_env = yes
env[SCROLL_WORKSPACES] = /var/lib/scroll-studio-web/workspaces
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 520M
php_admin_value[max_file_uploads] = 1
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120
php_admin_value[session.save_path] = /var/lib/scroll-studio-web/sessions
php_admin_value[session.gc_maxlifetime] = 86400
php_admin_value[upload_tmp_dir] = /var/lib/scroll-studio-web/uploads
php_admin_value[sys_temp_dir] = /var/lib/scroll-studio-web/uploads
php_admin_value[open_basedir] = /var/www/scroll-studio/releases/:/var/www/scroll-studio/current/:/var/lib/scroll-studio-web/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
security.limit_extensions = .php

