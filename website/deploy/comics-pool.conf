; Scroll Comics (/read/): accounts, series and episode uploads. Separate from the temporary Assets pool
; because episodes need many files per request and data must persist.
[scroll-comics]
user = scrollstudio
group = scrollstudio
listen = /run/php/scroll-comics.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 10s
pm.max_requests = 500
request_terminate_timeout = 300s
clear_env = yes
env[SCROLL_COMICS] = /var/lib/scroll-studio-web/comics
env[SCROLL_COMICS_ACCEL] = 1
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 200M
php_admin_value[post_max_size] = 205M
php_admin_value[max_file_uploads] = 121
php_admin_value[max_execution_time] = 280
php_admin_value[max_input_time] = 280
php_admin_value[upload_tmp_dir] = /var/lib/scroll-studio-web/comics-uploads
php_admin_value[sys_temp_dir] = /var/lib/scroll-studio-web/comics-uploads
php_admin_value[open_basedir] = /var/www/scroll-studio/releases/:/var/www/scroll-studio/current/:/var/lib/scroll-studio-web/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
security.limit_extensions = .php
